name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout progetto
        uses: actions/checkout@v4

      # Non usiamo un git submodule (evitiamo comandi git in locale):
      # scarichiamo libprojectM direttamente qui, dentro app/src/main/cpp/projectm
      - name: Checkout libprojectM
        uses: actions/checkout@v4
        with:
          repository: projectM-visualizer/projectm
          submodules: recursive
          path: app/src/main/cpp/projectm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa NDK e CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projectm-overlay-debug
          path: app/build/outputs/apk/debug/*.apk
